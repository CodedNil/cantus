[package]
name = "isthmus-build"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "isthmus"
required-features = ["compiler"]

[dependencies]
naga = { workspace = true, optional = true, features = ["spv-in", "wgsl-in", "wgsl-out"] }
spirv-builder = { git = "https://github.com/Rust-GPU/rust-gpu", rev = "c1acf6e4b2d338b0f822457350ea91db21757f1a", optional = true }
toml_edit = "0.25.13"

[features]
default = []
compiler = ["dep:naga", "dep:spirv-builder"]

[lints]
workspace = true
