[package]
name = "cantus"
version = "0.8.0"
edition = "2024"
default-run = "cantus"

[package.metadata.isthmus]
artifact = "../../assets/cantus.wgsl"

[[bin]]
name = "cantus"
path = "src/main.rs"
required-features = ["cpu"]

[features]
default = ["cpu"]
cpu = [
    "shader",
    "dep:ashpd",
    "dep:arrayvec",
    "dep:base64",
    "dep:bytemuck",
    "dep:fastrand",
    "dep:form_urlencoded",
    "dep:flate2",
    "dep:futures-util",
    "dep:getrandom",
    "dep:image",
    "dep:jiff",
    "dep:microfft",
    "dep:num-bigint",
    "dep:palette",
    "dep:pollster",
    "dep:librespot-protocol",
    "dep:hmac",
    "dep:quick-xml",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:protobuf",
    "dep:ring",
    "dep:sha1",
    "dep:shannon",
    "dep:sysinfo",
    "dep:ttf-parser",
    "dep:toml",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tungstenite",
    "dep:ureq",
    "dep:wayland-client",
    "dep:wayland-protocols",
    "dep:wayland-protocols-wlr",
    "isthmus/vulkan",
]
shader = []
generate-nix = ["cpu", "dep:schemars"]

[dependencies]
isthmus = { path = "../isthmus" }

# CPU application
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "location"], optional = true }
bytemuck = { workspace = true, optional = true }
arrayvec = { version = "0.7.8", features = ["serde"], optional = true }
tracing = { version = "0.1.44", default-features = false, features = ["std"], optional = true }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "fmt",
    "smallvec",
    "tracing-log",
], optional = true }
pollster = { version = "1.0.1", optional = true }
librespot-protocol = { version = "0.8.0", optional = true }
hmac = { version = "0.12.1", optional = true }
protobuf = { version = "3.7.2", optional = true }
num-bigint = { version = "0.4.6", optional = true }
ring = { version = "0.17.14", optional = true }
sha1 = { version = "0.10.6", features = ["oid"], optional = true }
shannon = { version = "0.2.0", optional = true }
tungstenite = { version = "0.28.0", default-features = false, features = ["handshake", "rustls-tls-native-roots"], optional = true }
quick-xml = { version = "0.41.0", optional = true }
wayland-client = { version = "0.31.15", default-features = false, features = ["system"], optional = true }
wayland-protocols = { version = "0.32.13", features = ["client", "staging"], optional = true }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"], optional = true }
ttf-parser = { version = "0.25.1", optional = true }
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
], optional = true }
palette = { version = "0.7.7", default-features = false, features = ["std"], optional = true }
serde = { workspace = true, features = ["rc"], optional = true }
serde_json = { version = "1.0.151", optional = true }
toml = { version = "1.1.4", optional = true }
schemars = { version = "1.2.2", features = ["arrayvec07", "preserve_order"], optional = true }
ureq = { version = "3.3.0", default-features = false, features = ["json", "rustls"], optional = true }
base64 = { version = "0.22.1", optional = true }
form_urlencoded = { version = "1.2.2", optional = true }
flate2 = { version = "1.1.8", optional = true }
futures-util = { version = "0.3.31", default-features = false, optional = true }
sha2 = { version = "0.11.0", default-features = false, optional = true }
getrandom = { version = "0.4.3", optional = true }
fastrand = { version = "2.5.0", optional = true }
microfft = { version = "0.6.0", default-features = false, features = ["size-1024", "std"], optional = true }
sysinfo = { git = "https://github.com/CodedNil/sysinfo", branch = "gpu_temp", default-features = false, features = [
    "component",
    "system",
    "gpu",
], optional = true }
jiff = { version = "0.2.35", default-features = false, features = [
    "serde",
    "std",
    "tz-system",
    "tzdb-zoneinfo",
], optional = true }

[lints]
workspace = true
