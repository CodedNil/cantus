[workspace]
resolver = "3"
members = [
    "crates/cantus",
    "crates/isthmus",
    "crates/isthmus_build",
    "crates/isthmus_macros",
]
default-members = ["crates/cantus"]

[workspace.dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = { version = "=0.33.2", default-features = false, features = ["bytemuck", "u32"] }
naga = { version = "30.0.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
wgpu = { version = "30.0.0", default-features = false }

[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = [
    'cfg(target_arch, values("spirv"))',
] }
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
must_use_candidate = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
suboptimal_flops = "allow"

absolute_paths = "warn"
separated_literal_suffix = "warn"
renamed_function_params = "warn"
str_to_string = "warn"
if_then_some_else_none = "warn"
redundant_type_annotations = "warn"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
strip = true


[profile.release.build-override]
opt-level = 0
codegen-units = 256

[profile.dev]
opt-level = 1
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3
